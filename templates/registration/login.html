{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Log in</h1>
    <form method="post" class="card shadow-sm card-body" novalidate>
      {% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger py-2">Your username and password did not match.</div>{% endif %}
      <div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 small text-center">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
