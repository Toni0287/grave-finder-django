{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <h1 class="h3 mb-3">Create an account</h1>
    <p class="text-muted">An account lets you create memorial pages and keep track of your donations.</p>
    <form method="post" class="card shadow-sm card-body" novalidate>
      {% csrf_token %}
      {% include "includes/form.html" %}
      <button class="btn btn-primary w-100" type="submit">Sign up</button>
    </form>
    <p class="mt-3 small text-center">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
