{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-3">{{ title }}</h1>
    <form method="post" class="card shadow-sm card-body" novalidate>
      {% csrf_token %}
      {% include "includes/form.html" %}
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'cemeteries:search' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
